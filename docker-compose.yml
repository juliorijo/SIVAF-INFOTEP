services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infotep}
      POSTGRES_USER: ${POSTGRES_USER:-sivaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infotep}
      POSTGRES_USER: ${POSTGRES_USER:-sivaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SIVAF_COOKIE_SECURE: ${SIVAF_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - sivaf_storage:/app/storage

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"

volumes:
  postgres_data:
  sivaf_storage:
